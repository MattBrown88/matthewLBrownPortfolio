<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="How to Audit a Vibe-Coded App Before Production">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141c3a"/>
      <stop offset="1" stop-color="#1f2a52"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6495ED"/>
      <stop offset="1" stop-color="#3f6fd6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="240" fill="#6495ED" opacity="0.12"/>
  <circle cx="120" cy="560" r="180" fill="#2bb6a3" opacity="0.12"/>

  <!-- left: label -->
  <rect x="96" y="270" width="72" height="6" rx="3" fill="#6495ED"/>
  <text x="96" y="335" font-family="Verdana, Geneva, sans-serif" font-size="34" fill="#8ea2d6" font-weight="700">SUPABASE</text>
  <text x="96" y="380" font-family="Verdana, Geneva, sans-serif" font-size="34" fill="#8ea2d6" font-weight="700">REACT · VERCEL</text>

  <!-- clipboard + shield illustration -->
  <g transform="translate(700,105)">
    <!-- clipboard body -->
    <rect x="30" y="40" width="300" height="360" rx="24" fill="#ffffff" opacity="0.06" stroke="#8ea2d6" stroke-width="3"/>
    <rect x="30" y="40" width="300" height="360" rx="24" fill="none" stroke="#6495ED" stroke-width="3" opacity="0.4"/>
    <!-- clip -->
    <rect x="140" y="20" width="80" height="46" rx="14" fill="#8ea2d6"/>
    <rect x="152" y="8" width="56" height="34" rx="12" fill="#aab4d4"/>

    <!-- checklist rows -->
    <g>
      <circle cx="90" cy="120" r="20" fill="#2bb6a3"/>
      <path d="M80 120l7 7 14-16" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="128" y="110" width="170" height="14" rx="7" fill="#ffffff" opacity="0.55"/>

      <circle cx="90" cy="192" r="20" fill="#2bb6a3"/>
      <path d="M80 192l7 7 14-16" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="128" y="182" width="140" height="14" rx="7" fill="#ffffff" opacity="0.55"/>

      <circle cx="90" cy="264" r="20" fill="#2bb6a3"/>
      <path d="M80 264l7 7 14-16" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="128" y="254" width="160" height="14" rx="7" fill="#ffffff" opacity="0.55"/>

      <circle cx="90" cy="336" r="20" fill="none" stroke="#8ea2d6" stroke-width="4"/>
      <rect x="128" y="326" width="120" height="14" rx="7" fill="#ffffff" opacity="0.3"/>
    </g>

    <!-- shield badge overlapping bottom-right -->
    <g transform="translate(230,250)">
      <path d="M90 8 L164 40 V116 C164 168 130 200 90 216 C50 200 16 168 16 116 V40 Z" fill="url(#shield)" stroke="#141c3a" stroke-width="4"/>
      <path d="M60 112l22 22 42-52" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
