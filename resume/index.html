  <script>
    // Keep the footer copyright year current
    (function () {
      var yearEl = document.getElementById('footer-year');
      if (yearEl) yearEl.textContent = new Date().getFullYear();
    })();

    // Render each page of the resume PDF onto a canvas inside the sheet
    (function () {
      var holder = document.getElementById('resumePages');
      var fallback = document.getElementById('resumeFallback');

      function fail() {
        holder.hidden = true;
        fallback.hidden = false;
      }

      if (!window.pdfjsLib) return fail();
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      pdfjsLib.getDocument('/content/resume/Matt-Brown-Resume.pdf').promise.then(function (pdf) {
        var width = holder.clientWidth || 800;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var tasks = [];
        for (var i = 1; i <= pdf.numPages; i++) {
          tasks.push(pdf.getPage(i).then(function (page) {
            var scale = (width * dpr) / page.getViewport({ scale: 1 }).width;
            var viewport = page.getViewport({ scale: scale });
            var canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport })
              .promise.then(function () { return { num: page.pageNumber, canvas: canvas }; });
          }));
        }
        return Promise.all(tasks).then(function (pages) {
          pages.sort(function (a, b) { return a.num - b.num; });
          pages.forEach(function (p) { holder.appendChild(p.canvas); });
        });
      }).catch(fail);
    })();
  </script>
